{% extends "datos_usuario.html" %}

{% block datos %}
<h2>Añadir una imagen</h2>

<form id="peli-form" action="./agregar_img.php?idPeli={{ idPeli }}" method="post">
    <label for="img">Imagen:</label>
    <input type="text" id="img" name="img" required>

    <button type="submit" class="peli-btn">Añadir</button>
</form>
{% endblock %}
